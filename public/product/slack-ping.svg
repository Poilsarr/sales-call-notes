  <text x="128" y="140" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="0.04em">CHANNELS</text>
  <rect x="120" y="152" width="156" height="32" rx="6" fill="#2C2F33"/>
  <text x="136" y="172" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF"># deal-room-vandelay</text>
  <text x="136" y="212" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9CA3AF"># sales-wins</text>
  <text x="136" y="240" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9CA3AF"># competitive-intel</text>

  <!-- Message pane -->
  <rect x="292" y="76" width="372" height="368" fill="#1A1D21"/>
  <rect x="292" y="76" width="372" height="52" fill="#1A1D21" stroke="#2C2F33" stroke-width="0"/>
  <line x1="292" y1="128" x2="664" y2="128" stroke="#2C2F33"/>
  <text x="312" y="108" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"># deal-room-vandelay</text>

