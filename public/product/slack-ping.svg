  <rect x="328" y="256" width="300" height="72" rx="8" fill="#1A1D21" stroke="#3F3F46"/>
  <rect x="328" y="256" width="3" height="72" rx="1.5" fill="#2563EB"/>
  <text x="344" y="280" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#D1D5DB">Our current contract with Otter</text>
  <text x="344" y="298" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#D1D5DB">expires in Q3  what would</text>
  <text x="344" y="316" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#D1D5DB">migration look like?</text>

  <!-- Meta pills -->
  <rect x="328" y="344" width="120" height="22" rx="11" fill="#1E3A5F"/>
  <text x="388" y="359" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#93C5FD">Priya Shah · Demo</text>
  <rect x="460" y="344" width="100" height="22" rx="11" fill="#14532D"/>
  <text x="510" y="359" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#86EFAC">Confidence 0.91</text>
</svg>
