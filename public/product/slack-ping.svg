<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Slack alert Competitor detected Otter.ai">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#131316" flood-opacity="0.1"/>
    </filter>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#131316" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="720" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F4F5"/>
      <stop offset="1" stop-color="#E8E8EC"/>
    </linearGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bgGrad)"/>

  <!-- Browser chrome -->
  <g filter="url(#softShadow)">
    <rect x="56" y="36" width="608" height="408" rx="14" fill="#1A1D21" stroke="#2C2F33" stroke-width="1"/>
    <rect x="56" y="36" width="608" height="40" rx="14" fill="#121417"/>
    <rect x="56" y="62" width="608" height="14" fill="#121417"/>
    <circle cx="78" cy="56" r="5" fill="#FF5F57"/>
    <circle cx="96" cy="56" r="5" fill="#FEBC2E"/>
    <circle cx="114" cy="56" r="5" fill="#28C840"/>
    <rect x="230" y="46" width="260" height="20" rx="6" fill="#23262A"/>
    <text x="360" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF">vandelay.slack.com / #deal-room-vandelay</text>
  </g>

  <!-- Slack sidebar strip -->
  <rect x="56" y="76" width="56" height="368" fill="#0B0C0E"/>
  <rect x="68" y="100" width="32" height="32" rx="8" fill="#F26522"/>
  <text x="84" y="121" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">G</text>
  <rect x="68" y="148" width="32" height="32" rx="8" fill="#2C2F33"/>
  <rect x="68" y="196" width="32" height="32" rx="8" fill="#2C2F33"/>

  <!-- Channel list -->
  <rect x="112" y="76" width="180" height="368" fill="#191B1F"/>
