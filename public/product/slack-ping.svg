  <g filter="url(#cardShadow)">
    <rect x="312" y="160" width="332" height="220" rx="12" fill="#23262A" stroke="#3F3F46"/>
  </g>

  <!-- Bot avatar -->
  <rect x="328" y="176" width="36" height="36" rx="8" fill="#F26522"/>
  <text x="346" y="199" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">G</text>
  <text x="376" y="192" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Gauge</text>
  <rect x="428" y="180" width="36" height="16" rx="4" fill="#3F3F46"/>
  <text x="446" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#A1A1AA">APP</text>
  <text x="476" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#6B7280">11:42 AM</text>

