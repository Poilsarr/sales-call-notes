<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Dark competitive radar intel dashboard">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F26522" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="barGong" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F26522"/>
      <stop offset="1" stop-color="#C44E18"/>
    </linearGradient>
    <linearGradient id="barOtter" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="barFire" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="720" height="480" fill="#0A0A0B"/>

  <!-- Browser chrome -->
  <g filter="url(#softShadow)">
    <rect x="36" y="24" width="648" height="432" rx="14" fill="#111113" stroke="#27272A" stroke-width="1"/>
    <rect x="36" y="24" width="648" height="40" rx="14" fill="#0C0C0E"/>
    <rect x="36" y="50" width="648" height="14" fill="#0C0C0E"/>
    <circle cx="58" cy="44" r="5" fill="#FF5F57"/>
    <circle cx="76" cy="44" r="5" fill="#FEBC2E"/>
    <circle cx="94" cy="44" r="5" fill="#28C840"/>
    <rect x="220" y="34" width="280" height="20" rx="6" fill="#18181B" stroke="#27272A"/>
    <text x="360" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#71717A">app.gauge.ai / radar</text>
  </g>

  <!-- Header -->
  <text x="60" y="100" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#71717A" letter-spacing="0.08em">COMPETITIVE RADAR</text>
  <text x="60" y="128" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#FAFAFA">Rival mention trends</text>

  <!-- Live flag -->
  <g filter="url(#glowOrange)">
    <rect x="560" y="100" width="100" height="28" rx="14" fill="#1C100A" stroke="#F26522"/>
  </g>
  <circle cx="580" cy="114" r="4" fill="#F26522">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="594" y="118" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F26522">LIVE</text>

  <!-- Chart panel -->
  <rect x="60" y="152" width="440" height="268" rx="12" fill="#161618" stroke="#27272A"/>

  <!-- Grid lines -->
  <line x1="100" y1="200" x2="460" y2="200" stroke="#27272A" stroke-width="1"/>
  <line x1="100" y1="260" x2="460" y2="260" stroke="#27272A" stroke-width="1"/>
  <line x1="100" y1="320" x2="460" y2="320" stroke="#27272A" stroke-width="1"/>
  <line x1="100" y1="380" x2="460" y2="380" stroke="#3F3F46" stroke-width="1"/>

  <text x="80" y="204" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#52525B">40</text>
  <text x="80" y="264" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#52525B">30</text>
  <text x="80" y="324" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#52525B">20</text>
  <text x="80" y="384" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#52525B">0</text>

  <!-- Bars: Gong cluster (tallest) -->
  <rect x="130" y="220" width="28" height="160" rx="4" fill="url(#barGong)"/>
  <rect x="164" y="250" width="28" height="130" rx="4" fill="#F26522" opacity="0.55"/>
  <rect x="198" y="280" width="28" height="100" rx="4" fill="#F26522" opacity="0.35"/>
  <text x="178" y="404" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FAFAFA">Gong</text>

  <!-- Otter -->
  <rect x="270" y="290" width="28" height="90" rx="4" fill="url(#barOtter)"/>
  <rect x="304" y="310" width="28" height="70" rx="4" fill="#3B82F6" opacity="0.55"/>
  <rect x="338" y="330" width="28" height="50" rx="4" fill="#3B82F6" opacity="0.35"/>
  <text x="318" y="404" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">Otter.ai</text>

  <!-- Fireflies -->
  <rect x="390" y="300" width="28" height="80" rx="4" fill="url(#barFire)"/>
  <rect x="424" y="320" width="28" height="60" rx="4" fill="#A78BFA" opacity="0.55"/>
  <text x="414" y="404" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">Fireflies</text>

  <!-- Side intel cards -->
  <rect x="520" y="152" width="140" height="80" rx="10" fill="#161618" stroke="#F26522" stroke-width="1.5"/>
  <text x="536" y="178" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#F26522" letter-spacing="0.04em">TOP RIVAL</text>
  <text x="536" y="204" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#FAFAFA">Gong</text>
  <text x="536" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#A1A1AA">+38% WoW</text>

  <rect x="520" y="248" width="140" height="80" rx="10" fill="#161618" stroke="#27272A"/>
  <text x="536" y="274" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#71717A" letter-spacing="0.04em">MENTIONS</text>
  <text x="536" y="300" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FAFAFA">127</text>
  <text x="536" y="318" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#A1A1AA">Last 7 days</text>

  <rect x="520" y="344" width="140" height="76" rx="10" fill="#161618" stroke="#27272A"/>
  <text x="536" y="370" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#71717A" letter-spacing="0.04em">DEALS AT RISK</text>
  <text x="536" y="398" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FAFAFA">9</text>
</svg>
