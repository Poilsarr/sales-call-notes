<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Google Meet caption capture Chrome extension UI">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#131316" flood-opacity="0.1"/>
    </filter>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#131316" flood-opacity="0.12"/>
    </filter>
    <filter id="popupShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#131316" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="meetBg" x1="0" y1="0" x2="720" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202124"/>
      <stop offset="1" stop-color="#17181A"/>
    </linearGradient>
  </defs>

  <rect width="720" height="480" fill="url(#meetBg)"/>

  <!-- Browser chrome (Chrome-like) -->
  <g filter="url(#softShadow)">
    <rect x="32" y="20" width="656" height="440" rx="12" fill="#292A2D" stroke="#3C4043"/>
    <rect x="32" y="20" width="656" height="44" rx="12" fill="#202124"/>
    <rect x="32" y="50" width="656" height="14" fill="#202124"/>
    <circle cx="54" cy="42" r="5" fill="#FF5F57"/>
    <circle cx="72" cy="42" r="5" fill="#FEBC2E"/>
    <circle cx="90" cy="42" r="5" fill="#28C840"/>
    <!-- Address bar -->
    <rect x="200" y="32" width="300" height="22" rx="11" fill="#303134"/>
    <text x="350" y="47" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#9AA0A6">meet.google.com / abc-defg-hij</text>
    <!-- Extension icon in toolbar -->
    <rect x="620" y="30" width="26" height="26" rx="6" fill="#F26522"/>
    <text x="633" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">G</text>
    <circle cx="642" cy="34" r="5" fill="#EF4444"/>
  </g>

  <!-- Meet video tiles background -->
  <rect x="48" y="80" width="420" height="280" rx="12" fill="#3C4043"/>
  <circle cx="258" cy="200" r="48" fill="#5F6368"/>
  <text x="258" y="208" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#E8EAED">SC</text>
  <rect x="64" y="324" width="120" height="24" rx="6" fill="#202124" opacity="0.85"/>
  <text x="124" y="340" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#E8EAED">Sarah Chen</text>

  <!-- Self tile -->
  <rect x="360" y="280" width="92" height="64" rx="8" fill="#5F6368"/>
  <text x="406" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E8EAED">You</text>

  <!-- Caption bar (Meet style) -->
  <rect x="100" y="380" width="320" height="48" rx="8" fill="#000000" opacity="0.72"/>
  <text x="260" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#E8EAED">We're also evaluating Gong and Chorus</text>
  <text x="260" y="418" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#E8EAED">for the rollout.</text>

  <!-- Extension popup -->
  <g filter="url(#popupShadow)">
    <rect x="488" y="88" width="180" height="300" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>
  </g>
  <!-- Popup header -->
  <rect x="488" y="88" width="180" height="48" rx="12" fill="#FAFAFA"/>
  <rect x="488" y="120" width="180" height="16" fill="#FAFAFA"/>
  <rect x="504" y="100" width="28" height="28" rx="7" fill="#F26522"/>
  <text x="518" y="119" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">G</text>
  <text x="540" y="112" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#131316">Gauge</text>
  <text x="540" y="128" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#71717A">Meet capture</text>

  <!-- Status -->
  <rect x="504" y="152" width="148" height="36" rx="8" fill="#ECFDF5"/>
  <circle cx="522" cy="170" r="5" fill="#16A34A"/>
  <text x="536" y="174" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#15803D">Capturing captions</text>

  <!-- Stats -->
  <text x="504" y="220" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#A1A1AA" letter-spacing="0.04em">THIS CALL</text>
  <text x="504" y="248" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#131316">00:14:22</text>
  <text x="504" y="268" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#71717A">Elapsed · live sync on</text>

  <rect x="504" y="288" width="148" height="1" fill="#E4E4E7"/>

  <!-- Signal pill -->
  <text x="504" y="316" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#A1A1AA" letter-spacing="0.04em">LAST SIGNAL</text>
  <rect x="504" y="328" width="148" height="32" rx="8" fill="#FFF4ED" stroke="#F26522"/>
  <text x="578" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F26522">Gong · 0.96</text>

  <!-- CTA -->
  <rect x="504" y="376" width="148" height="36" rx="8" fill="#F26522"/>
  <text x="578" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Open in Gauge</text>
</svg>
