      <text x="561" y="217" text-anchor="middle" font-size="8" fill="#c2410c">DUE OCT 14</text>
    </g>
    <g font-family="ui-monospace,Menlo,monospace" font-size="9">
      <circle cx="356" cy="244" r="7" fill="#818CF8"/>
      <text x="372" y="248" fill="#18181B" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Jake Doyle</text>
      <rect x="524" y="236" width="74" height="16" rx="8" fill="#EEF2FF"/>
      <text x="561" y="247" text-anchor="middle" font-size="8" fill="#4338CA">DUE OCT 17</text>
    </g>
    <g>
      <circle cx="356" cy="274" r="7" fill="#10B981"/>
      <text x="372" y="278" fill="#18181B" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">Sarah Chen</text>
      <rect x="524" y="266" width="74" height="16" rx="8" fill="#F0FDF4"/>
