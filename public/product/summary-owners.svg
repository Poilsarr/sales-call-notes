    <rect x="56" y="171" width="150" height="5" rx="2.5" fill="#18181B" opacity="0.8"/>
    <rect x="56" y="184" width="96" height="5" rx="2.5" fill="#27272A" opacity="0.4"/>
    <rect x="56" y="213" width="128" height="5" rx="2.5" fill="#18181B" opacity="0.8"/>
    <rect x="56" y="226" width="150" height="5" rx="2.5" fill="#27272A" opacity="0.4"/>
    <rect x="56" y="255" width="112" height="5" rx="2.5" fill="#18181B" opacity="0.8"/>
    <rect x="56" y="268" width="84" height="5" rx="2.5" fill="#27272A" opacity="0.4"/>
    <!-- owner chips -->
    <rect x="212" y="175" width="76" height="16" rx="8" fill="#FFF4ED"/>
    <text x="250" y="186" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#c2410c">MAYA KIM</text>
    <rect x="212" y="217" width="76" height="16" rx="8" fill="#EEF2FF"/>
    <text x="250" y="228" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#4338CA">JAKE DOYLE</text>
    <rect x="212" y="259" width="76" height="16" rx="8" fill="#ECFDF5"/>
    <text x="250" y="270" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#047857">SARAH CHEN</text>
  </g>

  <!-- owners panel -->
  <g>
    <rect x="330" y="166" width="286" height="118" rx="12" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1"/>
    <text x="350" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#71717A" letter-spacing="1">OWNERS</text>
    <g font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#3F3F46">
      <circle cx="356" cy="214" r="7" fill="#F26522"/>
