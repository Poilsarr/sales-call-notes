<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Sample call summary with owners and due dates">
  <rect width="640" height="400" fill="#FFFFFF"/>

  <!-- title row -->
  <text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#131316">Acme Corp · Discovery</text>
  <rect x="292" y="20" width="58" height="20" rx="10" fill="#FFF4ED"/>
  <text x="321" y="33" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#c2410c">BANT ✓</text>
  <rect x="358" y="20" width="66" height="20" rx="10" fill="#F4F4F5"/>
  <text x="391" y="33" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#52525B">42 min</text>
