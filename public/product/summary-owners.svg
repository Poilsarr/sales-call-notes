  <!-- crm write row -->
  <g>
    <text x="312" y="300" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#059669">SYNCED 12S AGO</text>
    <rect x="24" y="304" width="288" height="34" rx="9" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="44" cy="321" r="8" fill="#FF7A59"/>
    <text x="60" y="319" font-family="ui-monospace,Menlo,monospace" font-size="9" font-weight="600" fill="#18181B">HUBSPOT</text>
    <path d="M52 321h74" stroke="#F26522" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="134" cy="321" r="2.5" fill="#F26522"/>
    <circle cx="156" cy="321" r="8" fill="#00A1E0"/>
    <text x="172" y="319" font-family="ui-monospace,Menlo,monospace" font-size="9" font-weight="600" fill="#18181B">SALESFORCE</text>
    <circle cx="284" cy="321" r="6" fill="#10B981" opacity="0.15"/>
    <path d="M281 321l2 2 4-5" stroke="#059669" stroke-width="1.6" fill="none"/>
