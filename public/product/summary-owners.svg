  <!-- footer strip -->
  <rect x="0" y="366" width="640" height="34" fill="#FAFAFA"/>
  <line x1="0" y1="366" x2="640" y2="366" stroke="#E4E4E7" stroke-width="1"/>
  <text x="24" y="387" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#71717A">CONFIDENCE 0.96</text>
  <rect x="140" y="380" width="90" height="6" rx="3" fill="#ECECEC"/>
  <rect x="140" y="380" width="82" height="6" rx="3" fill="#F26522"/>
  <text x="616" y="387" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#047857">3 OWNERS · 3 ACTION ITEMS</text>
</svg>
