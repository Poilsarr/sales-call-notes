  <rect x="24" y="84" width="560" height="6" rx="3" fill="#18181B" opacity="0.85"/>
  <rect x="24" y="98" width="486" height="6" rx="3" fill="#27272A" opacity="0.55"/>
  <rect x="24" y="112" width="318" height="6" rx="3" fill="#27272A" opacity="0.35"/>

