<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Call summary card with owners and due dates">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#131316" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#131316" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="720" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F8"/>
      <stop offset="1" stop-color="#EEEEF0"/>
    </linearGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bgGrad)"/>

  <!-- Browser chrome -->
  <g filter="url(#softShadow)">
    <rect x="40" y="28" width="640" height="424" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <rect x="40" y="28" width="640" height="40" rx="14" fill="#FAFAFA"/>
    <rect x="40" y="54" width="640" height="14" fill="#FAFAFA"/>
    <circle cx="62" cy="48" r="5" fill="#FF5F57"/>
    <circle cx="80" cy="48" r="5" fill="#FEBC2E"/>
    <circle cx="98" cy="48" r="5" fill="#28C840"/>
    <rect x="220" y="38" width="280" height="20" rx="6" fill="#FFFFFF" stroke="#E4E4E7"/>
    <text x="360" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#71717A">app.gauge.ai / summary / acme-discovery</text>
  </g>

  <!-- Header -->
  <text x="64" y="100" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A1A1AA" letter-spacing="0.04em">CALL SUMMARY</text>
  <text x="64" y="126" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#131316">Acme Corp · Discovery</text>
  <rect x="500" y="104" width="156" height="26" rx="13" fill="#F4F4F5"/>
  <text x="578" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#52525B">42 min · 3 owners</text>

  <!-- Summary body card -->
  <g filter="url(#cardShadow)">
    <rect x="64" y="152" width="360" height="260" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>
  </g>
  <text x="84" y="184" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#131316">Key takeaways</text>
  <circle cx="92" cy="216" r="4" fill="#F26522"/>
  <text x="108" y="220" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#3F3F46">Evaluating Gong and Chorus for rollout</text>
  <circle cx="92" cy="252" r="4" fill="#F26522"/>
  <text x="108" y="256" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#3F3F46">Q3 timeline preferred; security review open</text>
  <circle cx="92" cy="288" r="4" fill="#F26522"/>
  <text x="108" y="292" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#3F3F46">Need side-by-side competitive comparison</text>

  <rect x="84" y="320" width="320" height="1" fill="#E4E4E7"/>
  <text x="84" y="352" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#131316">Sentiment</text>
  <rect x="84" y="368" width="200" height="10" rx="5" fill="#F4F4F5"/>
  <rect x="84" y="368" width="148" height="10" rx="5" fill="#16A34A"/>
  <text x="84" y="398" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#71717A">Positive · high buying intent</text>

  <!-- Owners panel -->
  <g filter="url(#cardShadow)">
    <rect x="444" y="152" width="212" height="260" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/>
  </g>
  <text x="464" y="184" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#131316">Owners &amp; due dates</text>

  <!-- Owner 1 -->
  <rect x="464" y="204" width="172" height="56" rx="10" fill="#FAFAFA" stroke="#E4E4E7"/>
  <circle cx="486" cy="232" r="14" fill="#F26522"/>
  <text x="486" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">MK</text>
  <text x="508" y="226" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#131316">Maya Kim</text>
  <text x="508" y="244" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#71717A">Comp sheet · Oct 9</text>

  <!-- Owner 2 -->
  <rect x="464" y="272" width="172" height="56" rx="10" fill="#FAFAFA" stroke="#E4E4E7"/>
  <circle cx="486" cy="300" r="14" fill="#131316"/>
  <text x="486" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">JR</text>
  <text x="508" y="294" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#131316">Jordan Rhee</text>
  <text x="508" y="312" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#71717A">Security pack · Oct 11</text>

  <!-- Owner 3 -->
  <rect x="464" y="340" width="172" height="56" rx="10" fill="#FFF8F4" stroke="#F26522"/>
  <circle cx="486" cy="368" r="14" fill="#F26522"/>
  <text x="486" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">SC</text>
  <text x="508" y="362" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#131316">Sarah Chen</text>
  <text x="508" y="380" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#F26522">Confirm budget · Oct 14</text>
</svg>
