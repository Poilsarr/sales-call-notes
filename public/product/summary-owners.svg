  <!-- rival signal + health -->
  <g>
    <rect x="330" y="304" width="140" height="34" rx="9" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
    <text x="348" y="318" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#9A3412" letter-spacing="1">RIVAL SIGNAL</text>
    <text x="348" y="331" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700" fill="#c2410c">Gong</text>
    <rect x="478" y="304" width="138" height="34" rx="9" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
