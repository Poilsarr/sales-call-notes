name: Post-deploy smoke

# Runs scripts/smoke-test.sh against the live URL after Vercel
# finishes deploying. Triggered via workflow_dispatch (manual
# button in the Actions tab) so deploys aren't blocked by
# Vercel preview-deploy timing quirks, plus deployment_status
# (Vercel bot) on every deploy.
#
# URL resolution: manual input → canonical prod URL for production
# deploys (Vercel's environment_url is the deployment-specific hash URL,
# which is SSO-gated) → the event URL otherwise → vercel.app fallback.
# (Do NOT default to usegauge.com: the domain isn't pointed at Vercel
# yet, so it fails TLS.)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke (default: prod)"
        required: false
        default: "https://usegauge.vercel.app"
        type: string
  deployment_status: {}

concurrency:
  group: post-deploy-smoke-${{ inputs.base_url || github.event.deployment_status.environment_url || 'prod' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Hit live URL
    # Preview deployments sit behind Vercel SSO (302 to login), so only
    # smoke production deploys — previews would fail on auth, not on code.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Smoke test live endpoints
        env:
          BASE_URL: ${{ inputs.base_url || (github.event.deployment.environment == 'production' && 'https://usegauge.vercel.app') || github.event.deployment_status.environment_url || 'https://usegauge.vercel.app' }}
        run: bash scripts/smoke-test.sh

      - name: Report (always)
        if: always()
        run: |
          echo "::notice::Smoke run finished. Exit code: $?"
          echo "URL tested: ${{ inputs.base_url || (github.event.deployment.environment == 'production' && 'https://usegauge.vercel.app') || github.event.deployment_status.environment_url || 'https://usegauge.vercel.app' }}"