name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

jobs:
  Tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - name: Write CI .env (override the prod .env that ships in the repo)
        run: |
          # The repo commits a .env with the prod DATABASE_URL so local
          # dev works without setup. CI must NOT touch prod — wipe it
          # and write a test-only .env before any Prisma or test step.
          rm -f .env
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb
          EXPORT_TOKEN_SECRET=test_secret_at_least_16_chars_for_ci
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          EOF
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npx tsc --noEmit
      - run: npm test
        env:
          EXPORT_TOKEN_SECRET: test_secret_at_least_16_chars_for_ci
      - name: Check schema/migration drift
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          SHADOW_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/shadowdb?schema=public
        run: |
          PGPASSWORD=testpass psql -h localhost -U testuser -d postgres -c 'CREATE DATABASE shadowdb;' 2>/dev/null || true
          npx tsx scripts/check-schema-drift.ts

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - name: Write CI .env
        run: |
          rm -f .env
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          EOF
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_dummy' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_dummy' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'https://dummy.upstash.io' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || 'dummy' }}
