name: Lighthouse

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Extract Vercel preview URL from PR comments
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const vercel = comments.find(c =>
              c.user && c.user.login && c.user.login.toLowerCase().includes('vercel')
            );
            // Default to the public production URL. Vercel preview deployments
            // are behind the user's workspace SSO, so Lighthouse (running
            // unauthenticated) gets redirected to vercel.com/login — the score
            // it produces is the login page, not the product. The user-facing
            // marketing score they care about is on the public domain.
            let url = 'https://callnotepro.com';
            if (vercel) {
              const m = (vercel.body || '').match(/https:\/\/[a-z0-9-]+\.vercel\.app\/?/i);
              if (m) {
                core.notice('Preview URL found but auditing production ' + url + ' to avoid the Vercel SSO login redirect.');
              } else {
                core.notice('No Vercel preview URL found — auditing production ' + url + '.');
              }
            } else {
              core.notice('No Vercel comment — auditing production ' + url + '.');
            }
            core.setOutput('url', url);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Lighthouse CI (soft-warn)
        id: lh
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v11
        with:
          # Action input is `urls` (plural), not `url`. Passing the wrong
          # key silently dropped the URL and `lhci collect` failed with
          # "No URLs provided to collect" — so the previous runs reported
          # a fake "Lighthouse OK" status while never scoring anything.
          urls: ${{ steps.preview.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Post Lighthouse summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = path.join(process.cwd(), '.lighthouseci');
            const thresholds = { performance: 90, accessibility: 95, 'best-practices': 90, seo: 95 };
            let body = `## :lighthouse: Lighthouse preview\n\nPreview: \`${{ steps.preview.outputs.url }}\`\n\n`;
            let anyWarn = false;
            try {
              const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'links.json'), 'utf8'));
              const reports = (manifest.links || []).filter(l => l.url && l.url.includes('report.html'));
              for (const link of reports) {
                const stem = link.url.split('/').pop().replace(/report\.html.*$/, '');
                const rpt = JSON.parse(fs.readFileSync(path.join(dir, stem + 'report.json'), 'utf8'));
                body += `### \`${rpt.finalDisplayedUrl || rpt.requestedUrl}\`\n\n`;
                body += '| Category | Score | Threshold | Status |\n|---|---|---|---|\n';
                for (const k of Object.keys(thresholds)) {
                  const c = rpt.categories && rpt.categories[k];
                  if (!c) continue;
                  const s = Math.round((c.score || 0) * 100);
                  const ok = s >= thresholds[k];
                  if (!ok) anyWarn = true;
                  body += `| ${c.title} | ${s} | \u2265 ${thresholds[k]} | ${ok ? '\u2705' : '\u26a0\ufe0f'} |\n`;
                }
                body += `\n[Full report](${link.url})\n\n`;
              }
            } catch (e) {
              body += `\u26a0\ufe0f Could not parse Lighthouse reports: ${e.message}\n`;
              anyWarn = true;
            }
            body += anyWarn
              ? '> :warning: Some scores below thresholds \u2014 **soft warning, merge not blocked**.'
              : '> :white_check_mark: All scores meet thresholds.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Soft-warn (do not fail)
        if: always()
        run: |
          if [ "${{ steps.lh.outcome }}" = "failure" ]; then
            echo "::warning::Lighthouse below thresholds — soft-warn, not failing."
          else
            echo "Lighthouse OK."
          fi