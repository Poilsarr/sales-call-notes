version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: callnote-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: callnote
      POSTGRES_PASSWORD: callnote_dev
      POSTGRES_DB: callnote_pro
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: callnote-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
